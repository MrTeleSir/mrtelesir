<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background: #238636; color: white; border: none; cursor: pointer; }
    button:disabled { background: #888; }
    #status { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
    .success { background: #dafbe1; color: #1a7f37; }
    .error { background: #ffebe9; color: #cf222e; }
  </style>
</head>
<body>

  <h2>Admin Panel</h2>

  <div class="form-group">
    <label for="token">GitHub Personal Access Token (Needs 'repo' scope):</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
  </div>

  <div class="form-group">
    <label for="owner">GitHub Username / Owner:</label>
    <input type="text" id="owner" placeholder="your-username" />
  </div>

  <div class="form-group">
    <label for="repo">Repository Name:</label>
    <input type="text" id="repo" placeholder="your-repo-name" />
  </div>

  <div class="form-group">
    <label for="branch">Branch Name:</label>
    <input type="text" id="branch" value="main" />
  </div>

  <div class="form-group">
    <label for="filePath">File Path to Edit (e.g., content.json or data.txt):</label>
    <input type="text" id="filePath" placeholder="content.json" />
  </div>

  <div class="form-group">
    <label for="content">File Content:</label>
    <textarea id="content" rows="8"></textarea>
  </div>

  <button id="saveBtn" onclick="saveToGithub()">Save & Push to GitHub</button>

  <div id="status"></div>

  <script>
    async function saveToGithub() {
      const token = document.getElementById('token').value.trim();
      const owner = document.getElementById('owner').value.trim();
      const repo = document.getElementById('repo').value.trim();
      const branch = document.getElementById('branch').value.trim();
      const path = document.getElementById('filePath').value.trim();
      const content = document.getElementById('content').value;
      const statusDiv = document.getElementById('status');
      const btn = document.getElementById('saveBtn');

      if (!token || !owner || !repo || !path) {
        showStatus('Please fill in all required fields.', false);
        return;
      }

      btn.disabled = true;
      showStatus('Checking file status on GitHub...', true, '#f6f8fa');

      try {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
        
        // 1. Fetch existing file (if it exists) to get its SHA blob
        let sha = null;
        const getResponse = await fetch(url, {
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (getResponse.ok) {
          const fileData = await getResponse.json();
          sha = fileData.sha; // Required when updating an existing file
        }

        // 2. Base64 encode the updated text content
        const encodedContent = btoa(unescape(encodeURIComponent(content)));

        // 3. Prepare payload for PUT request
        const payload = {
          message: `Update ${path} via Admin Panel`,
          content: encodedContent,
          branch: branch
        };

        if (sha) {
          payload.sha = sha; // Attach SHA if file already exists
        }

        // 4. Send PUT request to GitHub REST API
        const putResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await putResponse.json();

        if (putResponse.ok) {
          showStatus(`Successfully saved to GitHub! Commit: ${result.commit.sha.substring(0, 7)}`, true);
        } else {
          showStatus(`GitHub API Error: ${result.message}`, false);
        }
      } catch (err) {
        showStatus(`Request failed: ${err.message}`, false);
      } finally {
        btn.disabled = false;
      }
    }

    function showStatus(msg, isSuccess, customBg = null) {
      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      statusDiv.className = isSuccess ? 'success' : 'error';
      if (customBg) statusDiv.style.background = customBg;
      statusDiv.textContent = msg;
    }
  </script>

</body>
</html>
